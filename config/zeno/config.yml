snippets:

    # git
    - name: g
      keyword: g
      snippet: git
    
    - name: git s
      keyword: s
      snippet: status
      context:
        lbuffer: ^git\s
    
    - name: git a
      keyword: a
      snippet: add
      context:
        lbuffer: ^git\s
    
    - name: git aa
      keyword: aa
      snippet: add --all
      context:
        lbuffer: ^git\s

    - name: git l
      keyword: l
      snippet: log --oneline
      context:
        lbuffer: ^git\s
    
    - name: git c
      keyword: c
      snippet: commit
      context:
        lbuffer: ^git\s
    
    - name: git commit message
      keyword: gcim
      snippet: git commit -m '{{commit_message}}'
    
    - name: git push origin hoge
      keyword: gpo
      snippet: git push origin {{branch}}
    
    - name: git pull origin hoge
      keyword: gplo
      snippet: git pull origin {{branch}}
    
    - name: git restore from staging
      keyword: grs
      snippet: git restore --staged {{file}}
    
    - name: git reset most recent commit
      keyword: grc
      snippet: git reset --soft {{commit}}
    
    - name: claude
      keyword: cl
      snippet: claude
    
    - name: claude with dangerous permissions
      keyword: cld
      snippet: claude --dangerously-skip-permissions
    
    - name: worktree
      keyword: wt
      snippet: git worktree add -b {{branch}} ../{{branch}}
    
    - name: port check
      keyword: port
      snippet: lsof -i :{{port}}

completions:
  - name: git switch branch
    patterns:
      - "^git switch $"
    sourceCommand: "git branch --format='%(refname:short)'"
    options:
      --prompt: "'Branch> '"
      --preview: "git log --oneline --graph --decorate --color=always -20 {}"
  
  - name: git restore from staging
    patterns:
      - "^git restore --staged $"
    sourceCommand: "git diff --cached --name-only"
    options:
      --prompt: "'Select a file to unstage> '"
      --preview: "git diff --cached --color=always {}"
    
  - name: git reset most recent commit
    patterns:
      - "^git reset --soft $"
    sourceCommand: "git log --oneline -1"
    options:
      --prompt: "'Reset to this commit> '"
      --preview: "git show --color=always {}"
    callback: "awk '{print $1}'"

  
  - name: git push origin branch
    patterns:
      - "^git push origin $"
    sourceCommand: "git branch --format='%(refname:short)'"
    options:
      --prompt: "'Branch> '"
      --preview: "git log --oneline --graph --decorate --color=always -20 {}"

  # - name: kill pid
  #   patterns:
  #     - "^kill( .*)? $"
  #   sourceCommand: "LANG=C ps -ef"
  #   options:
  #     --header-lines: "1"
  #   callback: "awk '{print $2}'"

  - name: kill port process
    patterns: 
      - "^kill( .*)? $"
    sourceCommand: "lsof -i -P -n | grep LISTEN"
    options:
      --prompt: "'Select a process to kill (Port Listening)>'"
    callback: "awk '{print $2}'"
  
  - name: docker stop
    patterns:
      - "^docker stop $"
    sourceCommand: "docker ps"
    options:
      --header-lines: "1"
      --prompt: "'Docker Stop> '"
      --no-select-1: true
    callback: "awk '{print $1}'"

  - name: docker rm(コンテナ)
    patterns:
      - "^docker rm $"
    sourceCommand: "docker ps -a"
    options:
      --header-lines: "1"
      --prompt: "'Docker Remove Container> '"
      --no-select-1: true
    callback: "awk '{print $1}'"

  - name: docker rmi(イメージ)
    patterns:
      - "^docker rmi $"
    sourceCommand: "docker images"
    options:
      --header-lines: "1"
      --prompt: "'Docker Remove Image> '"
      --no-select-1: true
    callback: "awk '{print $3}'"
  
  - name: npm scripts
    patterns:
      - "^(npm|pnpm|bun) run $"
    sourceCommand:
      jq -r '.scripts | to_entries | .[] | .key + " = " + .value' package.json
    options:
      --no-select-1: true
    callback: "awk '{print $1}'"